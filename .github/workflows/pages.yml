name: Pubblicazione su GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Consente al workflow di pubblicare su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; le esecuzioni in coda vengono sostituite.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installazione dipendenze
        run: npm ci

      - name: Test unitari
        run: npm test -- --no-watch

      - name: Build di produzione
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vitanera/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
